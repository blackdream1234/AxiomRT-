[workspace]
resolver = "2"
members = ["kernel", "tools/axiomctl", "tools/axiom-fuzz", "studio"]
# Only the kernel builds by default: the workspace's default cargo
# target is bare-metal riscv64 (.cargo/config.toml), which cannot host the
# std-based developer tools. Build host tools with an explicit host target.
default-members = ["kernel"]

# Bare-metal kernel: unwinding is impossible; abort keeps the panic path
# small and deterministic (docs/06_FAULT_MODEL.md, KernelInvariantViolation).
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
